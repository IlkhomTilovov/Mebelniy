name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy frontend
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            web/dist/ root@${{ secrets.VPS_HOST }}:/var/www/mebelniy/dist/

      - name: Deploy backend
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_ed25519" \
            server/src server/package.json server/package-lock.json \
            root@${{ secrets.VPS_HOST }}:/root/mebelniy/server/

      - name: Install deps, fix permissions and restart
        run: |
          ssh -i ~/.ssh/id_ed25519 root@${{ secrets.VPS_HOST }} '
            set -e
            export PATH="/root/mebelniy/.node22/bin:$PATH"
            cd /root/mebelniy/server
            npm install --omit=dev
            chown -R www-data:www-data /var/www/mebelniy
            pm2 restart mebelniy-api
          '
